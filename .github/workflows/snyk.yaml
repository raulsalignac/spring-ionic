name: Snyk Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '30 4 * * 1' # Executa toda segunda-feira às 04:30 UTC

jobs:
  snyk-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
  
    - name: Set up Snyk CLI
      uses: snyk/actions@master
    
    - name: Login Snyk
      run:
        snyk auth ${{ secrets.SNYK_TOKEN }}
  
    - name: Snyk Code Test (SAST)
      # Realiza a análise estática do código-fonte (Snyk Code)
      run: snyk code test --severity-threshold=high
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  
    - name: Snyk SCA Test (Dependências)
      # Realiza a análise de dependências e pacotes de terceiros (SCA)
      run: snyk test --severity-threshold=high
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
